name: tower image

# Fork-only: builds the app image for Jake's self-hosted Mere on Tower and
# pushes it to GHCR. Upstream's own workflows build only on main and on PRs
# and push to Docker Hub, so this branch needs its own.

# No workflow_dispatch: GitHub offers it only for workflows on the default
# branch, and this file lives only on tower. Push a commit to rebuild.
on:
  push:
    branches:
      - tower

permissions:
  contents: read
  packages: write

# One group per commit: a re-run of a commit waits for its first run, and a
# second push cannot displace a pending run for an earlier commit.
concurrency:
  group: tower-image-${{ github.sha }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get app version and tag
        id: version
        run: |
          echo "version=$(git show -s --format=%cs HEAD | tr '-' '.')" >> "$GITHUB_OUTPUT"
          echo "tag=theme-$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
        with:
          version: v0.36.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tower pulls the tag and CA Auto Update follows its digest, so a tag must
      # never be pushed twice: a re-run would swap the bytes under it. DO NOT
      # treat every failed lookup as "absent": only GHCR's "not found" (missing
      # tag or package) lets the build go on, any other error stops it.
      - name: Refuse to overwrite a published tag
        env:
          IMAGE: ghcr.io/jacob-lasky/mere-medical:${{ steps.version.outputs.tag }}
        run: |
          if out=$(docker buildx imagetools inspect "$IMAGE" 2>&1); then
            echo "::error::$IMAGE is already published. Push a new commit to rebuild."
            exit 1
          fi
          case "$out" in
            *": not found"*) echo "$IMAGE is not published yet." ;;
            *) echo "::error::Could not check $IMAGE: $out"; exit 1 ;;
          esac

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          sbom: true
          cache-from: type=gha,scope=tower
          cache-to: type=gha,mode=max,scope=tower
          build-args: |
            MERE_APP_VERSION=${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ghcr.io/jacob-lasky/mere-medical:${{ steps.version.outputs.tag }}
